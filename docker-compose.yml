version: "3.8"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///app/data/homedoctor.db
      - HOMEDOCTOR_DATABASE_URL=data/homedoctor.db
      - HOMEDOCTOR_SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - EXTRA_ALLOWED_ORIGINS=http://124.156.193.122:3000,http://124.156.193.122:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
    # ★ Principle 1.5: data/ as named volume, NEVER deleted on deploy
    # Deployment scripts MUST use --exclude='data/' or volume mount
