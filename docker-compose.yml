version: "3.8"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
    environment:
      # Seed scripts read DATABASE_URL
      - DATABASE_URL=sqlite:///data/family-doctor.db
      # FastAPI app reads HOMEDOCTOR_DATABASE_URL (pydantic-settings env_prefix)
      - HOMEDOCTOR_DATABASE_URL=data/family-doctor.db
      - HOMEDOCTOR_SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
    # ★ Principle 1.5: data/ as named volume, NEVER deleted on deploy
    # Deployment scripts MUST use --exclude='data/' or volume mount
